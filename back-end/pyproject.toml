[project]
name = "back-end"
version = "0.1.0"
description = "DisasterResponse Phase 1 — voice triage interview backend"
readme = "README.md"
authors = [
    { name = "Marcus Nguyen", email = "marcus@marcusnguyen.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "faster-whisper>=1.1",
    "sqlmodel>=0.0.22",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "websockets>=13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
